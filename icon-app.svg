<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f1115"/>
  <circle cx="392" cy="120" r="230" fill="#8b5cf6" opacity="0.16"/>
  <circle cx="120" cy="420" r="200" fill="#3b82f6" opacity="0.12"/>
  <g transform="rotate(-40 256 256)">
    <!-- needle -->
    <line x1="256" y1="70" x2="256" y2="104" stroke="#c7ccd4" stroke-width="9" stroke-linecap="round"/>
    <!-- hub / cap -->
    <rect x="240" y="104" width="32" height="30" rx="7" fill="#f97316"/>
    <!-- barrel -->
    <rect x="214" y="134" width="84" height="300" rx="20" fill="#11151c" stroke="#e8eaed" stroke-width="9"/>
    <!-- liquid -->
    <rect x="224" y="150" width="64" height="150" rx="8" fill="#8b5cf6"/>
    <!-- plunger seal -->
    <rect x="214" y="292" width="84" height="20" rx="6" fill="#f97316"/>
    <!-- ticks -->
    <g stroke="#9aa1ad" stroke-width="7" stroke-linecap="round">
      <line x1="224" y1="184" x2="250" y2="184"/>
      <line x1="224" y1="220" x2="250" y2="220"/>
      <line x1="224" y1="256" x2="250" y2="256"/>
    </g>
    <!-- plunger rod -->
    <line x1="256" y1="312" x2="256" y2="452" stroke="#e8eaed" stroke-width="14" stroke-linecap="round"/>
    <rect x="222" y="448" width="68" height="18" rx="7" fill="#e8eaed"/>
  </g>
</svg>
